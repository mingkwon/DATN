<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Restaurant AI Manager - Đăng nhập & Đăng ký</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e65e",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                        "surface-dark": "#1c261f",
                        "border-dark": "#3c5344",
                        "text-muted": "#9db8a6",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    backgroundImage: {
                        'hero-pattern': "linear-gradient(to bottom, rgba(17, 33, 22, 0.6), rgba(17, 33, 22, 0.9))",
                    }
                },
            },
        }
    </script>
    
    <style>
        body {
            font-family: "Work Sans", "Noto Sans", sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #112116; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3c5344; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #19e65e; 
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }
    </style>

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Shared Components ---

        // The Left Panel is identical across both screens, so we componentize it.
        const LeftVisualPanel = () => {
            return (
                <div className="hidden lg:flex w-1/2 h-full relative flex-col justify-between p-12 overflow-hidden">
                    {/* Background Image */}
                    <div className="absolute inset-0 z-0">
                        <img 
                            alt="Modern fine dining restaurant interior with warm lighting" 
                            className="w-full h-full object-cover" 
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeLEuzWIa9rte8V7fzsIHPWCTHaRzZSKBz8sVKPnXQg45jUYgNPRXagjJYFkKr0rlRkQ-kconF0NmqPoKTebHaWA8sjOUwH82QyHGk0103d9_qfNGyuY13AIyMU-6q8vUlKX9-KV1GNxIdT0_qSjIn3pxMCGp0Fmp9_7sWRuKKkfNORpbzD2PoNPSOjcz0hIovhZLehEIwYBCuqlVt7XvcLcIsDKhhsJ2BbF3ek0HH2CLdc7niPnyANu_63_3ULsmBCGi77IIiL7Q"
                        />
                        <div className="absolute inset-0 bg-hero-pattern"></div>
                    </div>
                    {/* Brand/Logo Overlay */}
                    <div className="relative z-10 flex items-center gap-3">
                        <div className="size-10 bg-primary/20 rounded-xl flex items-center justify-center backdrop-blur-sm border border-primary/30">
                            <span className="material-symbols-outlined text-primary">restaurant_menu</span>
                        </div>
                        <h2 className="text-white text-2xl font-bold tracking-tight">Restaurant AI</h2>
                    </div>
                    {/* Feature Content */}
                    <div className="relative z-10 max-w-md">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 border border-primary/20 backdrop-blur-md mb-6">
                            <span className="material-symbols-outlined text-primary text-sm">auto_awesome</span>
                            <span className="text-primary text-xs font-bold uppercase tracking-wider">AI Powered</span>
                        </div>
                        <h1 className="text-4xl font-bold text-white mb-4 leading-tight">Quản lý nhà hàng thông minh hơn.</h1>
                        <p className="text-gray-300 text-lg leading-relaxed">
                            Tối ưu hóa quy trình, gợi ý thực đơn và phân tích doanh thu với công nghệ AI tiên tiến nhất dành cho nhà hàng của bạn.
                        </p>
                    </div>
                    {/* Footer/Location */}
                    <div className="relative z-10 flex items-center gap-2 text-gray-400 text-sm">
                        <span className="material-symbols-outlined text-base">location_on</span>
                        <span>Ho Chi Minh City, Vietnam</span>
                    </div>
                </div>
            );
        };

        const SocialLogin = () => (
            <div className="grid grid-cols-2 gap-4">
                <a className="flex w-full items-center justify-center gap-3 rounded-xl bg-surface-dark px-3 py-3 text-white ring-1 ring-inset ring-border-dark hover:bg-[#253229] focus-visible:ring-primary transition-all cursor-pointer">
                    <svg aria-hidden="true" className="h-5 w-5" viewBox="0 0 24 24">
                        <path d="M12.0003 20.45c4.6667 0 8.45-3.7833 8.45-8.45 0-4.6667-3.7833-8.45-8.45-8.45-4.6667 0-8.45 3.7833-8.45 8.45 0 4.6667 3.7833 8.45 8.45 8.45Z" fill="#fff" fillOpacity="0" stroke="currentColor" strokeWidth="0"></path>
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    </svg>
                    <span className="text-sm font-semibold">Google</span>
                </a>
                <a className="flex w-full items-center justify-center gap-3 rounded-xl bg-surface-dark px-3 py-3 text-white ring-1 ring-inset ring-border-dark hover:bg-[#253229] focus-visible:ring-primary transition-all cursor-pointer">
                    <svg aria-hidden="true" className="h-5 w-5 fill-current text-[#1877F2]" viewBox="0 0 24 24">
                        <path clipRule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fillRule="evenodd"></path>
                    </svg>
                    <span className="text-sm font-semibold">Facebook</span>
                </a>
            </div>
        );

        const MobileHeader = () => (
            <header className="flex lg:hidden items-center justify-between px-6 py-4 border-b border-border-dark">
                <div className="flex items-center gap-3">
                    <div className="size-8 bg-primary/20 rounded-lg flex items-center justify-center">
                        <span className="material-symbols-outlined text-primary text-sm">restaurant_menu</span>
                    </div>
                    <span className="font-bold text-white">Restaurant AI</span>
                </div>
                <button className="text-text-muted hover:text-white">
                    <span className="material-symbols-outlined">help</span>
                </button>
            </header>
        );

        const AuthTabs = ({ activeTab }) => (
            <div className="border-b border-border-dark">
                <nav aria-label="Tabs" className="-mb-px flex justify-center space-x-8">
                    <Link 
                        to="/" 
                        className={`${activeTab === 'login' 
                            ? 'border-primary text-primary' 
                            : 'border-transparent text-text-muted hover:border-gray-300 hover:text-gray-300'} 
                            whitespace-nowrap border-b-2 py-4 px-1 text-sm font-bold flex items-center gap-2`}
                    >
                        <span className="material-symbols-outlined text-[20px]">login</span>
                        Đăng nhập
                    </Link>
                    <Link 
                        to="/signup" 
                        className={`${activeTab === 'signup' 
                            ? 'border-primary text-primary' 
                            : 'border-transparent text-text-muted hover:border-gray-300 hover:text-gray-300'} 
                            whitespace-nowrap border-b-2 py-4 px-1 text-sm font-bold flex items-center gap-2`}
                    >
                        <span className="material-symbols-outlined text-[20px]">person_add</span>
                        Đăng ký
                    </Link>
                </nav>
            </div>
        );

        const FooterSupport = () => (
            <div className="p-6 text-center lg:text-right border-t lg:border-none border-border-dark">
                <button className="inline-flex items-center justify-center rounded-xl px-4 py-2 bg-surface-dark text-text-muted hover:text-white text-sm font-bold transition-colors">
                    <span className="material-symbols-outlined text-sm mr-2">headset_mic</span>
                    Trợ giúp &amp; Hỗ trợ
                </button>
            </div>
        );

        // --- Screen 1: Login ---
        const LoginScreen = () => {
            const [showPassword, setShowPassword] = useState(false);

            return (
                <div className="flex flex-col lg:flex-row h-full">
                    <LeftVisualPanel />
                    <div className="w-full lg:w-1/2 h-full flex flex-col relative overflow-y-auto bg-background-dark">
                        <MobileHeader />
                        
                        <div className="flex-1 flex flex-col justify-center items-center px-6 py-12 sm:px-12">
                            <div className="w-full max-w-[480px] space-y-8">
                                {/* Header Text */}
                                <div className="text-center space-y-2">
                                    <h1 className="text-3xl font-bold text-white tracking-tight">Chào mừng trở lại</h1>
                                    <p className="text-text-muted">Nhập thông tin đăng nhập của bạn để truy cập bảng điều khiển.</p>
                                </div>

                                <AuthTabs activeTab="login" />

                                {/* Form */}
                                <form className="space-y-6 mt-8" onSubmit={(e) => e.preventDefault()}>
                                    {/* Email Input */}
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium leading-6 text-white" htmlFor="email">Email hoặc Tên đăng nhập</label>
                                        <div className="relative rounded-xl shadow-sm">
                                            <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                                <span className="material-symbols-outlined text-text-muted">mail</span>
                                            </div>
                                            <input className="block w-full rounded-xl border-0 py-4 pl-12 text-white bg-surface-dark ring-1 ring-inset ring-border-dark placeholder:text-text-muted focus:ring-2 focus:ring-inset focus:ring-primary sm:text-base sm:leading-6 transition-all" id="email" name="email" placeholder="quanly@nhahang.com" type="email"/>
                                        </div>
                                    </div>
                                    {/* Password Input */}
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium leading-6 text-white" htmlFor="password">Mật khẩu</label>
                                        <div className="relative rounded-xl shadow-sm group">
                                            <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                                <span className="material-symbols-outlined text-text-muted">lock</span>
                                            </div>
                                            <input 
                                                className="block w-full rounded-xl border-0 py-4 pl-12 pr-12 text-white bg-surface-dark ring-1 ring-inset ring-border-dark placeholder:text-text-muted focus:ring-2 focus:ring-inset focus:ring-primary sm:text-base sm:leading-6 transition-all" 
                                                id="password" 
                                                name="password" 
                                                placeholder="••••••••" 
                                                type={showPassword ? "text" : "password"} 
                                            />
                                            <div 
                                                className="absolute inset-y-0 right-0 flex items-center pr-4 cursor-pointer hover:text-white text-text-muted"
                                                onClick={() => setShowPassword(!showPassword)}
                                            >
                                                <span className="material-symbols-outlined">{showPassword ? "visibility_off" : "visibility"}</span>
                                            </div>
                                        </div>
                                    </div>
                                    {/* Actions Row */}
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center">
                                            <input className="h-4 w-4 rounded border-border-dark bg-surface-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="remember-me" name="remember-me" type="checkbox"/>
                                            <label className="ml-2 block text-sm text-text-muted" htmlFor="remember-me">Ghi nhớ đăng nhập</label>
                                        </div>
                                        <div className="text-sm">
                                            <a className="font-semibold text-primary hover:text-green-400" href="#">Quên mật khẩu?</a>
                                        </div>
                                    </div>
                                    {/* Submit Button */}
                                    <div>
                                        <button className="flex w-full justify-center rounded-xl bg-primary px-3 py-4 text-sm font-bold leading-6 text-[#111813] shadow-sm hover:bg-green-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors duration-200" type="submit">
                                            Đăng nhập
                                        </button>
                                    </div>
                                </form>

                                {/* Divider */}
                                <div className="relative">
                                    <div aria-hidden="true" className="absolute inset-0 flex items-center">
                                        <div className="w-full border-t border-border-dark"></div>
                                    </div>
                                    <div className="relative flex justify-center text-sm font-medium leading-6">
                                        <span className="bg-background-dark px-6 text-text-muted">Hoặc tiếp tục với</span>
                                    </div>
                                </div>

                                <SocialLogin />
                            </div>
                        </div>

                        <FooterSupport />
                    </div>
                </div>
            );
        };

        // --- Screen 2: Sign Up ---
        const SignupScreen = () => {
            const [showPassword, setShowPassword] = useState(false);

            return (
                <div className="flex flex-col lg:flex-row h-full">
                    <LeftVisualPanel />
                    <div className="w-full lg:w-1/2 h-full flex flex-col relative overflow-y-auto bg-background-dark">
                        <MobileHeader />
                        
                        <div className="flex-1 flex flex-col justify-center items-center px-6 py-12 sm:px-12">
                            <div className="w-full max-w-[480px] space-y-8">
                                <div className="text-center space-y-2">
                                    <h1 className="text-3xl font-bold text-white tracking-tight">Tạo tài khoản mới</h1>
                                    <p className="text-text-muted">Nhập thông tin cá nhân của bạn để bắt đầu sử dụng.</p>
                                </div>

                                <AuthTabs activeTab="signup" />

                                <form className="space-y-5 mt-8" onSubmit={(e) => e.preventDefault()}>
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium leading-6 text-white" htmlFor="username">Tên người dùng</label>
                                        <div className="relative rounded-xl shadow-sm">
                                            <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                                <span className="material-symbols-outlined text-text-muted">person</span>
                                            </div>
                                            <input className="block w-full rounded-xl border-0 py-4 pl-12 text-white bg-surface-dark ring-1 ring-inset ring-border-dark placeholder:text-text-muted focus:ring-2 focus:ring-inset focus:ring-primary sm:text-base sm:leading-6 transition-all" id="username" name="username" placeholder="Nguyễn Văn A" type="text"/>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium leading-6 text-white" htmlFor="email">Email</label>
                                        <div className="relative rounded-xl shadow-sm">
                                            <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                                <span className="material-symbols-outlined text-text-muted">mail</span>
                                            </div>
                                            <input className="block w-full rounded-xl border-0 py-4 pl-12 text-white bg-surface-dark ring-1 ring-inset ring-border-dark placeholder:text-text-muted focus:ring-2 focus:ring-inset focus:ring-primary sm:text-base sm:leading-6 transition-all" id="email" name="email" placeholder="quanly@nhahang.com" type="email"/>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium leading-6 text-white" htmlFor="password">Mật khẩu</label>
                                        <div className="relative rounded-xl shadow-sm group">
                                            <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                                <span className="material-symbols-outlined text-text-muted">lock</span>
                                            </div>
                                            <input 
                                                className="block w-full rounded-xl border-0 py-4 pl-12 pr-12 text-white bg-surface-dark ring-1 ring-inset ring-border-dark placeholder:text-text-muted focus:ring-2 focus:ring-inset focus:ring-primary sm:text-base sm:leading-6 transition-all" 
                                                id="password" 
                                                name="password" 
                                                placeholder="••••••••" 
                                                type={showPassword ? "text" : "password"}
                                            />
                                            <div 
                                                className="absolute inset-y-0 right-0 flex items-center pr-4 cursor-pointer hover:text-white text-text-muted"
                                                onClick={() => setShowPassword(!showPassword)}
                                            >
                                                <span className="material-symbols-outlined">{showPassword ? "visibility_off" : "visibility"}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium leading-6 text-white" htmlFor="password_confirmation">Xác nhận mật khẩu</label>
                                        <div className="relative rounded-xl shadow-sm group">
                                            <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                                                <span className="material-symbols-outlined text-text-muted">lock_reset</span>
                                            </div>
                                            <input className="block w-full rounded-xl border-0 py-4 pl-12 pr-12 text-white bg-surface-dark ring-1 ring-inset ring-border-dark placeholder:text-text-muted focus:ring-2 focus:ring-inset focus:ring-primary sm:text-base sm:leading-6 transition-all" id="password_confirmation" name="password_confirmation" placeholder="••••••••" type="password"/>
                                        </div>
                                    </div>
                                    <div className="flex items-center pt-2">
                                        <input className="h-4 w-4 rounded border-border-dark bg-surface-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="agree-terms" name="agree-terms" type="checkbox"/>
                                        <label className="ml-2 block text-sm text-text-muted" htmlFor="agree-terms">
                                            Tôi đồng ý với <a className="text-primary hover:underline" href="#">Điều khoản sử dụng</a>
                                        </label>
                                    </div>
                                    <div>
                                        <button className="flex w-full justify-center rounded-xl bg-primary px-3 py-4 text-sm font-bold leading-6 text-[#111813] shadow-sm hover:bg-green-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors duration-200" type="submit">
                                            Đăng ký
                                        </button>
                                    </div>
                                </form>

                                <div className="relative">
                                    <div aria-hidden="true" className="absolute inset-0 flex items-center">
                                        <div className="w-full border-t border-border-dark"></div>
                                    </div>
                                    <div className="relative flex justify-center text-sm font-medium leading-6">
                                        <span className="bg-background-dark px-6 text-text-muted">Hoặc tiếp tục với</span>
                                    </div>
                                </div>

                                <SocialLogin />
                            </div>
                        </div>

                        <FooterSupport />
                    </div>
                </div>
            );
        };

        // --- Main Application ---
        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<LoginScreen />} />
                        <Route path="/signup" element={<SignupScreen />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
